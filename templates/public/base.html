<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Smart Library Management helps libraries organize members, memberships, payments and daily operations.">
    <title>{% block title %}Smart Library Management{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public-pages.css') }}">
</head>
<body>
    <header class="public-nav">
        <a class="brand" href="/home"><span class="brand-icon"><i class="bi bi-book-half"></i></span> Smart Library</a>
        <nav aria-label="Main navigation">
            <a href="/privacy-policy">Privacy</a>
            <a href="/terms-of-service">Terms</a>
            <a class="nav-login" href="/">Sign in</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="public-footer">
        <span>Smart Library Management</span>
        <div><a href="/privacy-policy">Privacy Policy</a><a href="/terms-of-service">Terms of Service</a></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
