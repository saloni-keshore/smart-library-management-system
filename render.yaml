# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint"
# and point it at the repo. Render reads this file and creates the service.
services:
  - type: web
    name: smart-library-app
    runtime: python
    plan: free
    # Python version comes from the .python-version file (3.12).
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT --call wsgi:create_app
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Render generates a strong random value on first deploy.
      - key: SECRET_KEY
        generateValue: true
      # Marked sync:false so Render prompts you for the value and never
      # stores these secrets in the repo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
